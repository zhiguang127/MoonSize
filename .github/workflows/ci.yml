name: MoonSize checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned MoonBit and core
        run: |
          export MOON_HOME="$RUNNER_TEMP/moonsize-toolchain"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          bash scripts/setup-ci.sh
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Check and test core on four backends
        run: |
          moon check --target all --deny-warn
          for target in wasm wasm-gc js native; do
            moon test --target "$target" --deny-warn
          done
      - name: Test CLI and build real Wasm fixtures
        run: |
          npm test
          npm run demo
          npm run package:check
          npm run pr:check
          mkdir -p dist
          npm pack --pack-destination dist
          sha256sum dist/*.tgz > dist/SHA256SUMS
      - name: Size policy and Job Summary
        run: |
          node bin/moonsize.mjs diff reports/demo/before.wasm reports/demo/after.wasm \
            --before-build reports/demo/before.build.json \
            --after-build reports/demo/after.build.json \
            --policy examples/ci-policy.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --html reports/demo/report.html --json-file reports/demo/ci-result.json
      - name: Reproduce pinned external cases and optimization
        run: python3 scripts/build-cases.py
      - name: Upload reports and fixture manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonsize-evidence
          path: |
            reports/demo/*.wasm
            reports/demo/*.html
            reports/demo/*.json
            reports/cases/
            dist/
